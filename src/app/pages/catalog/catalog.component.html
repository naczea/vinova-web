<div class="catalog-page">
    <div class="catalog-header">
        <h1>Catálogo de Productos</h1>
        <p>Explora nuestra selección de lentes y gafas.</p>
    </div>

    <div *ngIf="loading" class="loading-state">
        <i class="fa-solid fa-spinner fa-spin"></i> Cargando catálogo...
    </div>

    <div *ngIf="!loading && items.length === 0" class="empty-state">
        <p>No hay productos disponibles en este momento.</p>
    </div>

    <div *ngIf="!loading && items.length > 0" class="products-grid">
        <div class="product-card" *ngFor="let item of items">
            <div class="product-image">
                <img [src]="item.image_url || 'images/logo/principal.png'" [alt]="item.name">
                <span class="stock-badge" *ngIf="item.stock < 5">¡Últimas unidades!</span>
            </div>
            <div class="product-info">
                <h3>{{ item.name }}</h3>
                <p class="brand">{{ item.brand }}</p>
                <div class="price-row">
                    <span class="price">${{ item.price }}</span>
                    <!-- Puedes añadir un botón para contactar por whatsapp aquí -->
                    <a href="https://wa.me/XXXXXXXXXX?text=Me%20interesa%20el%20producto:%20{{item.name}}" target="_blank" class="btn-contact">
                        <i class="fa-brands fa-whatsapp"></i> Consultar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
