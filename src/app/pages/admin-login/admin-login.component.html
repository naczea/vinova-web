<div class="login-container">
  <div class="login-box">
    <h2>Acceso Administrativo</h2>
    <p>Ingresa tus credenciales</p>
    
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder=" ">
        <label for="email">Correo:</label>
      </div>
      
      <div class="form-group">
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder=" ">
        <label for="password">Contraseña:</label>
      </div>

      <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Validando...' : 'Iniciar Sesión' }}
      </button>
    </form>
  </div>
</div>
