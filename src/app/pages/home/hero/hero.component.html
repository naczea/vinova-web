<section class="vinova-hero">
    <picture class="vinova-hero__bg">
        <source
            type="image/avif"
            srcset="/assets/images/home/hero/hero-karolina2-480.avif 480w, /assets/images/home/hero/hero-karolina2-768.avif 768w, /assets/images/home/hero/hero-karolina2-1200.avif 1200w, /assets/images/home/hero/hero-karolina2-1600.avif 1600w"
            sizes="100vw"
        />
        <source
            type="image/webp"
            srcset="/assets/images/home/hero/hero-karolina2-480.webp 480w, /assets/images/home/hero/hero-karolina2-768.webp 768w, /assets/images/home/hero/hero-karolina2-1200.webp 1200w, /assets/images/home/hero/hero-karolina2-1600.webp 1600w"
            sizes="100vw"
        />
        <img
            src="/assets/images/home/hero/hero-karolina2.jpg"
            alt="Opt. Karolina Bayas Chaves atendiendo a una paciente en el consultorio de VINOVA"
            width="3200"
            height="1800"
            fetchpriority="high"
            decoding="async"
            (error)="onHeroImageError($event)"
        />
    </picture>
    <div class="vinova-hero__container">
        <picture class="vinova-hero__mobile-photo">
            <source
                type="image/avif"
                srcset="/assets/images/home/hero/hero-karolina-480.avif 480w, /assets/images/home/hero/hero-karolina-768.avif 768w, /assets/images/home/hero/hero-karolina-1200.avif 1200w, /assets/images/home/hero/hero-karolina-1600.avif 1600w"
                sizes="(min-width: 768px) 600px, calc(100vw - 32px)"
            />
            <source
                type="image/webp"
                srcset="/assets/images/home/hero/hero-karolina-480.webp 480w, /assets/images/home/hero/hero-karolina-768.webp 768w, /assets/images/home/hero/hero-karolina-1200.webp 1200w, /assets/images/home/hero/hero-karolina-1600.webp 1600w"
                sizes="(min-width: 768px) 600px, calc(100vw - 32px)"
            />
            <img
                src="/assets/images/home/hero/hero-karolina.jpg"
                alt="Opt. Karolina Bayas Chaves atendiendo a una paciente"
                width="1200"
                height="1800"
                fetchpriority="high"
                decoding="async"
                (error)="onHeroImageError($event)"
            />
        </picture>
        <div class="vinova-hero__copy">
            <h1 class="vinova-hero__title">{{ content.hero.headline }}</h1>
            <p class="vinova-hero__subtitle">{{ content.hero.subheadline }}</p>
            <div class="vinova-hero__actions">
                <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="v-btn v-btn--primary">
                    {{ content.hero.ctaBtnWhatsappLabel }}
                </a>
                <a [routerLink]="['/']" fragment="contacto" class="v-btn v-btn--on-media">
                    {{ content.hero.ctaSecondaryLabel }}
                </a>
            </div>
        </div>
    </div>
</section>
